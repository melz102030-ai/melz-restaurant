name: Deploy Firestore Rules

# خطوة مستقلة عن بناء الويب: كانت جزءاً من نشر Firebase Hosting الذي يُتخطّى
# لغياب سرّه، فلم تكن تعديلات القواعد تصل لقاعدة البيانات إطلاقاً
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore_tests/**"
      - ".github/scripts/deploy-firestore-rules.mjs"
      - ".github/workflows/deploy-firestore-rules.yml"

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # لا تُنشر قواعد تفشل اختباراتها، حتى لا تتعطل طلبات العملاء أو تُفتح ثغرة
      - name: Test rules
        run: |
          npm install --prefix firestore_tests --no-audit --no-fund
          if ! npx firebase-tools@latest emulators:exec --only firestore --project demo-melz "npm --prefix firestore_tests test" > "$RUNNER_TEMP/out.log" 2>&1; then
            grep -E "✖" "$RUNNER_TEMP/out.log" | sort -u | head -n 12 | sed 's/^/::error::/'
            exit 1
          fi

      # نفس حساب الخدمة الذي يستخدمه خادم الدفع
      - name: Deploy rules
        run: node .github/scripts/deploy-firestore-rules.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
