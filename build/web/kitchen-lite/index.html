<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مطبخ Meals</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --purple: #6A0DAD;
    --purple-light: #9C4DCA;
    --purple-soft: rgba(106,13,173,.12);
    --bg: #F5EEDC;
    --surface: #FFFFFF;
    --surface-light: #EADFC8;
    --text-primary: #1A0030;
    --text-secondary: #5B4A75;
    --text-hint: #9B8BAD;
    --success: #4CAF50;
    --warning: #FF9800;
    --error: #F44336;
    --st-pending: #FF9800;
    --st-confirmed: #2196F3;
    --st-preparing: #9C4DCA;
    --st-ready: #4CAF50;
    --st-delivery: #00838F;
    --st-delivered: #1B5E20;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* ── Login ───────────────────────────────────────────────── */
  #loginView {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--surface); border-radius: 20px;
    padding: 28px 24px; box-shadow: 0 10px 30px rgba(106,13,173,.15);
  }
  .login-logo {
    width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #fff; font-weight: bold;
    box-shadow: 0 6px 16px rgba(106,13,173,.35);
  }
  .login-title { text-align: center; font-size: 20px; font-weight: bold; margin: 0 0 4px; }
  .login-sub { text-align: center; color: var(--text-secondary); font-size: 13px; margin: 0 0 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
  .field input {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--surface-light);
    background: var(--bg); color: var(--text-primary); font-size: 15px; outline: none;
  }
  .field input:focus { border-color: var(--purple); }
  .btn-primary {
    width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--purple), var(--purple-light)); color: #fff;
    font-size: 15px; font-weight: bold; margin-top: 6px;
    box-shadow: 0 6px 16px rgba(106,13,173,.3);
  }
  .btn-primary:disabled { opacity: .6; }
  .login-error {
    background: rgba(244,67,54,.1); color: var(--error); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 14px; display: none;
  }

  /* ── App shell ───────────────────────────────────────────── */
  #appView { display: none; min-height: 100vh; padding-bottom: 20px; }
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
    display: flex; align-items: center; gap: 10px;
  }
  .topbar-title { flex: 1; }
  .topbar-title h1 { font-size: 16px; margin: 0; }
  .topbar-title p { font-size: 11.5px; color: var(--text-secondary); margin: 2px 0 0; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none; background: var(--surface-light);
    color: var(--purple); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .stop-alarm-btn {
    border: none; background: rgba(244,67,54,.12); color: var(--error); font-weight: bold;
    font-size: 12px; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  }
  .offline-banner {
    background: var(--warning); color: #fff; text-align: center; padding: 8px 14px; font-size: 12.5px; font-weight: bold;
  }
  .alarm-banner {
    background: #d32f2f; color: #fff; text-align: center; padding: 12px 16px; font-size: 14.5px;
    font-weight: bold; cursor: pointer; animation: pulse-bg 1s infinite;
  }
  @keyframes pulse-bg { 0%,100% { background:#d32f2f; } 50% { background:#ff5252; } }

  .section { padding: 18px 16px 4px; }
  .section-head { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .section-head h2 { font-size: 15px; margin: 0; }
  .count-pill { background: var(--purple); color: #fff; font-size: 10.5px; font-weight: bold; border-radius: 10px; padding: 2px 7px; }
  .empty-msg { color: var(--text-hint); font-size: 13px; padding: 8px 0; }
  .chev { margin-right: auto; color: var(--text-hint); }

  /* ── Order card ──────────────────────────────────────────── */
  .order-card {
    background: var(--surface); border-radius: 20px; margin: 10px 0; overflow: hidden;
    border: 1px solid rgba(0,0,0,.06); animation: fadeSlide .35s ease both;
  }
  .order-card.urgent { border: 2px solid var(--error); box-shadow: 0 4px 16px rgba(244,67,54,.18); }
  @keyframes fadeSlide { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  .order-head {
    padding: 14px; display: flex; gap: 10px; align-items: flex-start;
  }
  .order-id {
    font-weight: bold; font-size: 13px; padding: 5px 9px; border-radius: 9px; white-space: nowrap;
  }
  .order-info { flex: 1; min-width: 0; }
  .order-name { font-weight: bold; font-size: 14.5px; }
  .order-phone { font-size: 11.5px; color: var(--text-hint); }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .badge { font-size: 9.5px; font-weight: bold; padding: 2px 6px; border-radius: 6px; }
  .order-side { text-align: left; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .call-btn { border: none; background: rgba(76,175,80,.12); color: var(--success); width: 32px; height: 32px; border-radius: 9px; font-size: 14px; cursor: pointer; }
  .pill { font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 8px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }

  .order-items { padding: 2px 14px 6px; }
  .order-item-row { display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 13.5px; }
  .qty-box { background: var(--purple-soft); color: var(--purple); font-weight: bold; font-size: 12px; border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .item-opts { font-size: 10.5px; color: var(--text-secondary); padding-right: 2px; }

  .order-notes {
    margin: 4px 14px; padding: 9px 10px; background: rgba(255,152,0,.08); border: 1px solid rgba(255,152,0,.2);
    border-radius: 10px; font-size: 12.5px; color: var(--warning);
  }

  .driver-panel { margin: 4px 14px 0; }
  .driver-assign-btn {
    border: 1.5px solid rgba(106,13,173,.4); background: transparent; color: var(--purple);
    font-size: 12px; font-weight: bold; padding: 7px 12px; border-radius: 10px; cursor: pointer; float: left;
  }
  .driver-status { padding: 7px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 7px; }

  .order-expand { padding: 10px 14px 0; display: none; }
  .order-expand.open { display: block; }
  .order-expand input, .order-expand textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--surface-light);
    background: var(--bg); color: var(--text-primary); font-size: 13.5px; margin-bottom: 8px; font-family: inherit;
  }

  .order-actions { padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .text-btn { border: none; background: transparent; color: var(--text-hint); font-size: 12.5px; font-weight: bold; cursor: pointer; padding: 6px 4px; }
  .action-btns { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; flex: 1; }
  .action-btn {
    border: none; color: #fff; font-size: 12px; font-weight: bold; padding: 9px 13px; border-radius: 10px;
    cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .action-btn.loading { opacity: .6; pointer-events: none; }

  /* ── Modal ───────────────────────────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-card {
    background: var(--surface); border-radius: 18px; width: 100%; max-width: 420px; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head {
    padding: 16px; background: linear-gradient(135deg, var(--purple), var(--purple-light)); color: #fff; font-weight: bold; font-size: 15.5px;
  }
  .modal-body { padding: 10px 16px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 10px 16px 16px; text-align: center; }
  .modal-foot button { border: none; background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; padding: 8px; }
  .driver-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--bg); cursor: pointer; }
  .driver-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--purple-soft); display: flex; align-items: center; justify-content: center; color: var(--purple); font-size: 16px; }
  .driver-row-name { font-weight: bold; font-size: 13.5px; }
  .driver-row-status { font-size: 11px; }
  .confirm-text { font-size: 14px; line-height: 1.6; color: var(--text-secondary); padding: 4px 4px 16px; }
  .modal-actions { display: flex; gap: 10px; padding: 0 16px 16px; }
  .modal-actions button { flex: 1; padding: 11px; border-radius: 10px; border: none; font-weight: bold; font-size: 13.5px; cursor: pointer; }
  .btn-ghost { background: var(--surface-light); color: var(--text-primary); }
  .btn-danger { background: var(--error); color: #fff; }

  /* ── Availability view ───────────────────────────────────── */
  #availView { display: none; }
  .avail-search { padding: 10px 16px 4px; }
  .avail-search input {
    width: 100%; padding: 11px 14px; border-radius: 12px; border: none; background: var(--surface);
    font-size: 14px; color: var(--text-primary);
  }
  .avail-cat { padding: 14px 16px 4px; font-weight: bold; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .avail-cat .bar { width: 4px; height: 18px; background: var(--purple); border-radius: 2px; }
  .avail-item {
    margin: 0 16px 8px; background: var(--surface); border-radius: 14px; padding: 11px 13px;
    display: flex; align-items: center; gap: 11px; border: 1px solid rgba(106,13,173,.15);
  }
  .avail-item.off { background: var(--surface-light); border-color: rgba(244,67,54,.25); }
  .avail-icon { width: 46px; height: 46px; border-radius: 9px; background: var(--surface-light); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; object-fit: cover; }
  .avail-info { flex: 1; min-width: 0; }
  .avail-name { font-size: 13.5px; font-weight: 600; }
  .avail-price { font-size: 11.5px; color: var(--purple); margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 25px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--text-hint); border-radius: 20px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 19px; height: 19px; right: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--success); }
  .switch input:checked + .slider:before { transform: translateX(-19px); }

  /* ── Receipt (print only) ───────────────────────────────── */
  #receiptArea { display: none; }
  @media print {
    body > *:not(#receiptArea) { display: none !important; }
    #receiptArea { display: block !important; position: absolute; top: 0; right: 0; }
  }
  #receiptArea .slip { width: 76mm; margin: 0 auto; padding: 3mm; font-size: 12px; font-family: 'Courier New', monospace; color: #000; }
  #receiptArea h1 { font-size: 16px; text-align: center; margin: 0 0 2px; }
  #receiptArea .center { text-align: center; }
  #receiptArea .hint { font-size: 10px; color: #555; }
  #receiptArea .line { border-top: 1px dashed #000; margin: 6px 0; }
  #receiptArea table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #receiptArea td { padding: 2px 0; vertical-align: top; }
  #receiptArea .total td { font-weight: bold; font-size: 14px; padding-top: 4px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200;
    background: var(--text-primary); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 6px 16px rgba(0,0,0,.25); max-width: 90vw; text-align: center;
  }
</style>
</head>
<body>

  <!-- ───────── Login ───────── -->
  <div id="loginView">
    <div class="login-card">
      <div class="login-logo">M</div>
      <p class="login-title">دخول المطبخ</p>
      <p class="login-sub">هذه الصفحة مخصّصة لفريق المطبخ فقط</p>
      <div id="loginError" class="login-error"></div>
      <form id="loginForm">
        <div class="field">
          <label>رقم الجوال</label>
          <input id="phoneInput" type="tel" inputmode="tel" autocomplete="username" required>
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input id="passwordInput" type="password" autocomplete="current-password" required>
        </div>
        <button id="loginBtn" class="btn-primary" type="submit">دخول</button>
      </form>
    </div>
  </div>

  <!-- ───────── App ───────── -->
  <div id="appView">
    <header class="topbar">
      <div class="topbar-title">
        <h1>شاشة المطبخ</h1>
        <p id="activeCount">مجموع النشط: 0 طلب</p>
      </div>
      <button id="stopAlarmBtn" class="stop-alarm-btn hidden">إيقاف 🔇</button>
      <button id="availBtn" class="icon-btn" title="إدارة توفر الأصناف">🍽️</button>
      <button id="logoutBtn" class="icon-btn" title="خروج">⏻</button>
    </header>

    <div id="offlineBanner" class="offline-banner hidden">⚠️ لا يوجد اتصال بالخادم — البيانات قد لا تكون محدَّثة</div>
    <div id="alarmBanner" class="alarm-banner hidden">🔔 طلب جديد وصل! — اضغط لإيقاف الصوت</div>

    <div id="ordersRoot"></div>
  </div>

  <!-- ───────── Availability ───────── -->
  <div id="availView">
    <header class="topbar">
      <button class="icon-btn" id="availBackBtn">◀</button>
      <div class="topbar-title"><h1>توفر الأصناف</h1></div>
    </header>
    <div class="avail-search"><input id="availSearch" placeholder="ابحث عن صنف..."></div>
    <div id="availRoot"></div>
  </div>

  <div id="receiptArea"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
