name: Scaffold Android platform (one-time)

# يُشغَّل يدوياً مرة واحدة فقط لتوليد مجلد android/ باستخدام أدوات Flutter
# الرسمية نفسها (بدل كتابته يدوياً — يضمن تطابق نسخة gradle wrapper وكل
# الملفات الثنائية مع نسخة Flutter الفعلية المستخدمة في البناء)
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate android/ platform folder
        run: flutter create --platforms=android --org com.melz --project-name melz_restaurant .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons from restaurant logo
        run: dart run flutter_launcher_icons

      - name: Commit and push android/
        run: |
          git config user.email "melz102030@gmail.com"
          git config user.name "melz-bot"
          git add android -f
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "build: scaffold android/ platform folder + generate launcher icons [skip ci]"
          git push
