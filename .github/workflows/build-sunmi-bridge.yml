name: Build Sunmi Print Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'sunmi_print_bridge/**'
      - '.github/workflows/build-sunmi-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # تطبيق Sunmi جسر صغير مستقل (أندرويد فقط) — يُولَّد مشروعه الأندرويدي
      # الكامل تلقائياً هنا (بدلاً من حفظ ملفات Gradle الضخمة في المستودع)،
      # ثم نستبدل فقط ملفاته المخصَّصة المحفوظة في sunmi_print_bridge/
      - name: Scaffold Android project
        run: |
          flutter create --platforms=android --org com.kababjik --project-name sunmi_print_bridge /tmp/bridge_build
          cp sunmi_print_bridge/pubspec.yaml /tmp/bridge_build/pubspec.yaml
          cp sunmi_print_bridge/lib/main.dart /tmp/bridge_build/lib/main.dart
          cp sunmi_print_bridge/android/app/src/main/AndroidManifest.xml /tmp/bridge_build/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: /tmp/bridge_build
        run: flutter pub get

      - name: Build release APK
        working-directory: /tmp/bridge_build
        run: flutter build apk --release

      - name: Publish APK to repo
        run: |
          mkdir -p sunmi_print_bridge/release
          cp /tmp/bridge_build/build/app/outputs/flutter-apk/app-release.apk sunmi_print_bridge/release/sunmi-print-bridge.apk
          git config user.email "melz102030@gmail.com"
          git config user.name "melz-bot"
          git add sunmi_print_bridge/release/sunmi-print-bridge.apk -f
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "build: sunmi-print-bridge apk [skip ci]"
          git push
