name: Deploy Cloudflare Worker (delete image)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # أسرار Cloudinary تُضبط في كل تشغيل (idempotent) بدل مرة واحدة يدوياً،
      # حتى يبقى إعادة النشر بسيطاً ولا يعتمد على خطوة يدوية منفصلة تُنسى
      - name: Set Cloudinary secrets
        run: |
          echo "${{ secrets.CLOUDINARY_API_KEY }}" | npx wrangler@latest secret put CLOUDINARY_API_KEY
          echo "${{ secrets.CLOUDINARY_API_SECRET }}" | npx wrangler@latest secret put CLOUDINARY_API_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
