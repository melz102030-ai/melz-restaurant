name: Build Flutter Web

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      # نسخة خفيفة جداً (شاشة المطبخ فقط) لأجهزة الكاشير ضعيفة الإمكانيات —
      # صفحة HTML/JS عادية بلا فلاتر إطلاقاً (راجع web_kitchen_lite/)، لأن
      # محرك فلاتر نفسه (CanvasKit, ~7 ميغا WASM) هو أكبر سبب للثقل على هذه
      # الأجهزة، لا حجم كود التطبيق — تُنسخ كما هي بلا أي خطوة بناء.
      # تُنشر على /k/ (رابط قصير مقصود — راجع lib/shared/utils/kitchen_redirect.dart)
      - name: Publish kitchen-lite web
        run: |
          rm -rf build/web/k
          mkdir -p build/web/k
          cp -r web_kitchen_lite/* build/web/k/

      # صفحة وسيطة صغيرة فقط (راجع web_admin_entry/) — manifest.json مستقل
      # يمنح رابط الإدارة هوية تطبيق قابل للتثبيت خاصة به (اسم وأيقونة)،
      # بدل مشاركة نفس هوية تطبيق العميل عند التثبيت على الشاشة الرئيسية.
      # تُنشر على /a/ (رابط قصير مقصود)
      - name: Publish admin-entry web
        run: |
          rm -rf build/web/a
          mkdir -p build/web/a
          cp -r web_admin_entry/* build/web/a/

      # صفحة عرض المنيو التفاعلية — HTML/JS خالصة تقرأ من Firestore مباشرة
      # تُنشر على /m/ (menu — رابط قصير للمشاركة مع العملاء والزوار)
      - name: Publish menu-lite web
        run: |
          rm -rf build/web/m
          mkdir -p build/web/m
          cp -r web_menu_lite/* build/web/m/

      # يُنشر مباشرة بعد البناء (قبل الالتزام بالمخرجات) بدل الاعتماد على
      # تشغيل منفصل يُحفَّز بتعديل build/web — التزام البناء يحمل [skip ci]
      # فيُعطَّل أي تشغيل جديد لأي workflow أصلاً على ذلك الالتزام
      - name: Install Firebase CLI
        if: env.HAS_FIREBASE_SA == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE_SA == 'true'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json
          firebase hosting:sites:create meals --project melz-restaurant || true
          firebase deploy --only hosting,firestore:rules --project melz-restaurant --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json

      - name: Commit and push build
        run: |
          git config user.email "melz102030@gmail.com"
          git config user.name "melz-bot"
          # احتفظ بمخرجات البناء الجديدة جانباً قبل أي مزامنة مع origin
          cp -r build/web /tmp/web-build-output
          # زامن مع آخر حالة لـ origin/main بدل محاولة دمج ملفات JS المولَّدة
          # نصياً — الدمج النصي على ملفات مثل main.dart.js يُفضي إلى
          # تعارضات حقيقية غير قابلة للحل تلياً لأن كل بناءَين مستقلَّين
          # ينتجان محتوى مختلفاً كلياً حتى لو كان مصدرهما متطابقاً
          git fetch origin main
          git reset --hard origin/main
          # استعد مخرجات البناء فوق الحالة المزامَنة
          rm -rf build/web
          cp -r /tmp/web-build-output build/web
          git add build/web -f
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "build: update web [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected, retrying ($i)..."
            git fetch origin main
            git reset --hard origin/main
            rm -rf build/web
            cp -r /tmp/web-build-output build/web
            git add build/web -f
            git commit -m "build: update web [skip ci]"
            sleep 3
          done
