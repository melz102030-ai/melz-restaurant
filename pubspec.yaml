name: melz_restaurant
description: Melz Restaurant - تطبيق مطعم ميلز
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.10

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.67.0
  shimmer: ^3.0.0

  # Utilities
  url_launcher: ^6.3.0
  http: ^1.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  equatable: ^2.0.5
  timeago: ^3.6.1
  file_picker: ^8.0.3
  excel: ^4.0.6

  # Location & Maps (driver / delivery system)
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Appearance settings (admin theme control panel)
  flutter_colorpicker: ^1.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# يولّد أيقونة التطبيق لأندرويد من شعار المطعم الفعلي (assets/icon/icon.jpg)
# — الشعار يحتوي خلفية بنفسجية مصمتة بالفعل فلا حاجة لأيقونة adaptive منفصلة.
# شغّلها محلياً بعد أي تحديث للشعار عبر: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21
