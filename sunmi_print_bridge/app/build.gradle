plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// تطبيق أندرويد أصلي خفيف جداً (بلا فلاتر إطلاقاً، بلا أي محرك واجهة) —
// استبدل نسخة فلاتر السابقة التي كانت تستهلك ذاكرة كافية لتضطر أندرويد
// لإغلاق تبويب كروم (صفحة المطبخ) من الذاكرة على هذا الجهاز الضعيف
// (890 ميغا فقط)، فتُعاد الصفحة من الصفر عند الرجوع إليها.
android {
    namespace 'com.kababjik.sunmiprintbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.kababjik.sunmiprintbridge"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // مفتاح توقيع ثابت ومُلتزَم به في المستودع (keystore/bridge-release.keystore)
    // بدل مفتاح debug الافتراضي العشوائي — كل عامل CI جديد على GitHub Actions
    // يولِّد مفتاح debug مختلفاً من الصفر، فكان كل بناء يُوقَّع بمفتاح مختلف
    // عن سابقه، ما يجعل أندرويد يرفض أي تثبيت فوق النسخة السابقة بصمت
    // (يبدو وكأن التطبيق "اختفى" رغم تحميله بنجاح)
    signingConfigs {
        release {
            storeFile rootProject.file("keystore/bridge-release.keystore")
            storePassword "kababjik2026"
            keyAlias "bridge"
            keyPassword "kababjik2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // يولِّد Android Gradle Plugin تلقائياً أصناف الواجهة (Stub) من ملفات
    // .aidl الموجودة في src/main/aidl/ — معطَّل افتراضياً منذ AGP 7، يحتاج
    // تفعيلاً صريحاً هنا
    buildFeatures {
        aidl true
    }
}

dependencies {
    // الواجهة (interface) المطلوبة للطابعة معرَّفة محلياً في src/main/aidl/
    // (نفس واجهة SDK الرسمية)، وAGP يولِّد صنف الاتصال بها تلقائياً.
    // androidx.core فقط من أجل NotificationCompat (إشعار الخدمة الدائمة)
    implementation 'androidx.core:core-ktx:1.13.1'
}
