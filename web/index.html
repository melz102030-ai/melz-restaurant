  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #F8F5FF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Cairo', 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Photo collage background (كولاج صور متحركة يديره الأدمن) ────── */
    #splash-collage {
      position: fixed;
      inset: 0;
      z-index: -1;
      display: none;
      gap: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    #splash-collage.ready { opacity: 1; }

    .collage-col {
      flex: 1;
      position: relative;
      overflow: hidden;
      height: 100vh;
    }

    .collage-track {
      display: flex;
      flex-direction: column;
      gap: 0;
      animation-name: collageScroll;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .collage-col:nth-child(1) .collage-track { animation-duration: 34s; }
    .collage-col:nth-child(2) .collage-track { animation-duration: 26s; }
    .collage-col:nth-child(3) .collage-track { animation-duration: 30s; }

    @keyframes collageScroll {
      from { transform: translateY(0); }
      to   { transform: translateY(-50%); }
    }

    .collage-track img {
      width: 100%;
      display: block;
      object-fit: cover;
      image-rendering: -webkit-optimize-contrast;
    }

    .collage-scrim {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg,
        rgba(248, 245, 255, 0.55) 0%,
        rgba(248, 245, 255, 0.82) 45%,
        rgba(248, 245, 255, 0.94) 100%);
    }

    /* ── Floating background particles ─────────────────────────────── */
    .bg-particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .bg-particles svg {
      position: absolute;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.6); }
      12%  { opacity: 1; }
      88%  { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(calc(-100vh - 60px)) scale(1); }
    }

    /* ── Loading container ──────────────────────────────────────────── */
    #loading {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #5B4A75;
      width: 100%;
      padding: 0 24px;
    }

    /* Spring pop-in — mirrors Curves.elasticOut from Flutter login screen */
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.45); }
      55%  { opacity: 1; transform: scale(1.07); }
      72%  { transform: scale(0.96); }
      86%  { transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Subtle slide-up for text elements */
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Square banner — logo is 1:1 so no letterboxing */
    .logo-banner {
      width: min(80vw, 300px);
      height: min(80vw, 300px);
      border-radius: 24px;
      background: linear-gradient(135deg, #4A0080, #800040, #8B0000);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 8px 40px rgba(106,13,173,0.32);
      overflow: hidden;
      animation: popIn 0.75s ease-out forwards;
    }

    .logo-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo-banner svg {
      width: 80px;
      height: 80px;
      fill: rgba(255,255,255,0.85);
    }

    #loading p {
      color: #5B4A75;
      font-size: 0.95rem;
      margin-bottom: 28px;
      animation: fadeSlide 0.4s ease 0.3s both;
    }

    /* Progress bar */
    .progress-track {
      width: 200px;
      height: 4px;
      background: #EDE7F6;
      border-radius: 4px;
      margin: 0 auto 12px;
      overflow: hidden;
      animation: fadeSlide 0.4s ease 0.35s both;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6A0DAD, #CC1100);
      border-radius: 4px;
      animation: progress 3s ease-in-out forwards;
    }

    @keyframes progress {
      0%   { width: 5%; }
      30%  { width: 40%; }
      60%  { width: 65%; }
      85%  { width: 85%; }
      100% { width: 95%; }
    }

    .loading-text {
      color: #9B8BAD;
      font-size: 0.8rem;
      animation: fadeSlide 0.4s ease 0.4s both, blink 1.5s 0.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1; }
    }

    /* Fade out when Flutter is ready */
    #loading.hide {
      animation: fadeOut 0.4s ease forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(0.95); }
    }
  </style>

  <script>
    (function () {
      var banner = document.getElementById('logo-banner');
      var shownFromCache = false;

      function showLogo(url) {
        var img = document.createElement('img');
        img.alt = 'Meals';
        img.src = url;
        // Insert immediately — browser HTTP cache makes this near-instant on repeat visits
        banner.style.background = 'none';
        banner.innerHTML = '';
        banner.appendChild(img);
        img.onerror = function () {
          // Restore gradient + icon if image fails to load
          banner.style.background = 'linear-gradient(135deg,#4A0080,#800040,#8B0000)';
          banner.innerHTML = '<svg viewBox="0 0 24 24" fill="rgba(255,255,255,.85)" width="80" height="80"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>';
        };
      }

      // Show cached URL immediately (no network needed — logo appears from frame 1)
      var cached = localStorage.getItem('mlz_logo');
      if (cached) {
        shownFromCache = true;
        showLogo(cached);
      }

      // Fetch fresh URL in background and update cache for next visit
      fetch('https://firestore.googleapis.com/v1/projects/melz-restaurant/databases/(default)/documents/settings/restaurant?key=AIzaSyC6DBWYEkTNv7QE0P7MAbtJSlSc6YiJnw0')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var url = data && data.fields && data.fields.logoUrl && data.fields.logoUrl.stringValue;
          if (url) {
            localStorage.setItem('mlz_logo', url);
            // Only update DOM if we didn't already show the cached logo
            if (!shownFromCache) showLogo(url);
          }
        })
        .catch(function () {});
    })();

    // ── كولاج صور شاشة التحميل — يُقرأ من مجموعة splash_images في Firestore ──
    (function () {
      var CACHE_KEY = 'mlz_splash_images';
      var collage = document.getElementById('splash-collage');

      function buildCollage(urls) {
        if (!urls || !urls.length) return;

        var cols = window.innerWidth < 480 ? 2 : 3;
        var heights = [170, 230, 190, 250, 210, 180];
        var buckets = [];
        var c;
        for (c = 0; c < cols; c++) buckets.push([]);
        urls.forEach(function (u, i) { buckets[i % cols].push(u); });

        collage.innerHTML = '';
        collage.style.display = 'flex';

        buckets.forEach(function (list, ci) {
          if (!list.length) return;
          // نكرر القائمة مرتين لضمان تمرير لا نهائي سلس (النقلة = 50% من الطول)
          var doubled = list.concat(list);
          var col = document.createElement('div');
          col.className = 'collage-col';
          var track = document.createElement('div');
          track.className = 'collage-track';
          doubled.forEach(function (u, i) {
            var img = document.createElement('img');
            img.src = u;
            img.alt = '';
            img.style.height = heights[(i + ci * 2) % heights.length] + 'px';
            track.appendChild(img);
          });
          col.appendChild(track);
          collage.appendChild(col);
        });

        requestAnimationFrame(function () {
          collage.classList.add('ready');
        });
      }

      var cached = localStorage.getItem(CACHE_KEY);
      var shownFromCache = false;
      if (cached) {
        try {
          var parsed = JSON.parse(cached);
          if (parsed && parsed.length) {
            shownFromCache = true;
            buildCollage(parsed);
          }
        } catch (e) {}
      }

      fetch('https://firestore.googleapis.com/v1/projects/melz-restaurant/databases/(default)/documents/splash_images?orderBy=sortOrder&pageSize=40&key=AIzaSyC6DBWYEkTNv7QE0P7MAbtJSlSc6YiJnw0')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var docs = (data && data.documents) || [];
          var urls = docs
            .filter(function (d) {
              var active = d.fields && d.fields.isActive;
              return !active || active.booleanValue !== false;
            })
            .map(function (d) {
              return d.fields && d.fields.imageUrl && d.fields.imageUrl.stringValue;
            })
            .filter(Boolean);

          if (urls.length) {
            localStorage.setItem(CACHE_KEY, JSON.stringify(urls));
            if (!shownFromCache) buildCollage(urls);
          }
        })
        .catch(function () {});
    })();

    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.classList.add('hide');
      setTimeout(function () { el.style.display = 'none'; }, 420);
    });
  </script>

  <!-- Kitchen alarm — Web Audio API, no file needed -->
  <script>
    // سياق صوتي واحد دائم يُعاد استخدامه دوماً — الخلل السابق كان إنشاء سياق
    // جديد مؤقت في التهيئة (primeKitchenAudio) يُغلَق فوراً، بينما التشغيل
    // الفعلي (playKitchenAlarm) كان يُنشئ سياقاً آخر مختلفاً تماماً وغير
    // مُهيَّأ من إشعار Firestore (وليس من تفاعل مستخدم مباشر)، فتبدأ المتصفحات
    // الحديثة هذا السياق الجديد بحالة "معلَّق" ولا يصدر أي صوت فعلياً بصمت
    var _kCtx = null;

    function _getKitchenCtx() {
      if (!_kCtx) {
        _kCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return _kCtx;
    }

    function playKitchenAlarm() {
      try {
        var ctx = _getKitchenCtx();

        function scheduleTones() {
          function tone(freq, startSec, durationSec, vol) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startSec);
            gain.gain.setValueAtTime(vol, ctx.currentTime + startSec);
            gain.gain.setValueAtTime(vol, ctx.currentTime + startSec + durationSec - 0.02);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + startSec + durationSec);
            osc.start(ctx.currentTime + startSec);
            osc.stop(ctx.currentTime + startSec + durationSec + 0.01);
          }

          // Pattern: HIGH(0.27s) + LOW(0.23s) = 0.5s per rep, 40 reps = 20 seconds of alarm
          var REPS = 40;
          for (var i = 0; i < REPS; i++) {
            var t = i * 0.5;
            tone(1400, t,        0.25, 1.0);   // high, very loud
            tone(750,  t + 0.25, 0.23, 1.0);   // low, very loud
          }
        }

        // السياق قد يكون معلَّقاً (خصوصاً عند استدعائه من إشعار خلفي وليس من
        // ضغطة مستخدم مباشرة) — نستأنفه أولاً ثم نجدول النغمات بعد التأكد
        if (ctx.state === 'suspended') {
          ctx.resume().then(scheduleTones).catch(function (e) {
            console.warn('Kitchen alarm resume failed:', e);
          });
        } else {
          scheduleTones();
        }
      } catch (e) {
        console.warn('Kitchen alarm error:', e);
      }
    }

    function stopKitchenAlarm() {
      // تعليق السياق بدل إغلاقه — يبقى صالحاً لإعادة الاستخدام في التنبيه التالي
      if (_kCtx) {
        try { _kCtx.suspend(); } catch (e) {}
      }
    }

    // تهيئة السياق الصوتي الدائم مبكراً عند أول تفاعل من المستخدم — يمنح
    // المتصفح إذناً بتشغيل صوت لاحقاً برمجياً من إشعار خلفي بلا تفاعل مباشر
    function primeKitchenAudio() {
      try {
        var ctx = _getKitchenCtx();
        if (ctx.state === 'suspended') ctx.resume();
      } catch (e) {}
    }

    // ── إشعارات المتصفح (Web Notification API) ─────────────────────────
    // تعمل طالما التبويب مفتوح في الخلفية — بدون حاجة لخادم إشعارات
    function requestNotifyPermission() {
      try {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'default') {
          Notification.requestPermission();
        }
      } catch (e) {}
    }

    function showOrderReadyNotification(title, body) {
      try {
        if (!('Notification' in window)) return;
        if (Notification.permission !== 'granted') return;
        var n = new Notification(title, {
          body: body,
          icon: 'icons/Icon-192.png',
          tag: 'order-ready',
        });
        n.onclick = function () {
          window.focus();
          n.close();
        };
      } catch (e) {}
    }

    // ── كشف iOS Safari (لا يدعم beforeinstallprompt) ────────────────────
    function isIosSafariInstallable() {
      try {
        var isIos = /iP(hone|od|ad)/.test(navigator.platform) ||
          (navigator.userAgent.includes('Mac') && 'ontouchend' in document);
        var isStandalone = window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches;
        return isIos && !isStandalone;
      } catch (e) {
        return false;
      }
    }

    // ── PWA Install Prompt ────────────────────────────────────────────
    var _pwaInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();           // منع ظهور البانر التلقائي للمتصفح
      _pwaInstallPrompt = e;
      window._pwaInstallReady = true;
    });

    // تُستدعى من Flutter عند ضغط المستخدم على زر التحميل
    window.showPwaInstallPrompt = function() {
      if (!_pwaInstallPrompt) return;
      _pwaInstallPrompt.prompt();
      _pwaInstallPrompt.userChoice.then(function() {
        _pwaInstallPrompt = null;
        window._pwaInstallReady = false;
      });
    };

    // إخفاء البانر بعد التثبيت الفعلي
    window.addEventListener('appinstalled', function() {
      _pwaInstallPrompt = null;
      window._pwaInstallReady = false;
    });

    // تهيئة تلقائية عند أول تفاعل في أي مكان بالصفحة
    // (يضمن أن الصوت جاهز قبل وصول المستخدم لشاشة المطبخ)
    function _onFirstGesture() {
      primeKitchenAudio();
      ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(function(ev) {
        document.removeEventListener(ev, _onFirstGesture, true);
      });
    }
    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(function(ev) {
      document.addEventListener(ev, _onFirstGesture, { capture: true, once: true });
    });
  </script>
</body>
</html>
