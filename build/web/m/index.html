<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<base href="/m/">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ميلز</title>
<link rel="icon" href="/icons/Icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icons/Icon-192.png">
<meta name="theme-color" id="metaTheme" content="#6A0DAD">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary:   #6A0DAD;
  --secondary: #800040;
  --bg:        #F5EEDC;
  --card:      #FFFFFF;
  --text:      #1A0030;
  --text2:     rgba(26,0,48,.6);
  --text3:     rgba(26,0,48,.35);
  --p10:       rgba(106,13,173,.1);
  --p20:       rgba(106,13,173,.2);
  --border:    rgba(106,13,173,.15);
  --font:      'Cairo', sans-serif;
  --r:         16px;
  --shadow:    0 4px 20px rgba(0,0,0,.09);
  --shadow-p:  0 6px 24px rgba(106,13,173,.25);
}

html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.view { display: none; min-height: 100vh; }
.view.active { display: flex; flex-direction: column; }

/* ════ LANDING ════ */
#landing {
  align-items: center;
  justify-content: center;
  padding: 50px 20px 70px;
  text-align: center;
}
.landing-inner { width: 100%; max-width: 380px; }

.logo-ring {
  width: 110px; height: 110px;
  border-radius: 50%; padding: 3px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  margin: 0 auto 22px;
  box-shadow: var(--shadow-p);
}
.logo-inner {
  width: 100%; height: 100%;
  border-radius: 50%; background: var(--p10);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.logo-inner img { width: 100%; height: 100%; object-fit: cover; }
/* shimmer placeholder — بدون emoji */
.logo-ph {
  width: 55%; height: 55%; border-radius: 50%;
  background: linear-gradient(90deg, var(--p10) 25%, var(--p20) 50%, var(--p10) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.land-name { font-size: 30px; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
.land-tagline { font-size: 14px; color: var(--text2); margin-bottom: 40px; }

.link-btn {
  display: flex; align-items: center; gap: 14px;
  width: 100%; padding: 15px 18px; margin-bottom: 11px;
  border-radius: var(--r); border: 1.5px solid var(--border);
  background: var(--card); color: var(--text);
  font-family: var(--font); font-size: 15px; font-weight: 700;
  cursor: pointer; text-decoration: none; text-align: right;
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.link-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-p); border-color: var(--primary); }
.link-btn:active { transform: translateY(0); }
.btn-icon {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--p10); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--primary);
}
.btn-icon svg { stroke: currentColor; }
.btn-text { flex: 1; }
.btn-arrow { color: var(--text3); font-size: 20px; flex-shrink: 0; font-weight: 300; }
.link-btn.featured {
  background: var(--primary); color: #fff;
  border-color: var(--primary); box-shadow: var(--shadow-p);
}
.link-btn.featured .btn-icon { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.25); color: #fff; }
.link-btn.featured .btn-arrow { color: rgba(255,255,255,.6); }
.link-btn.featured:hover { filter: brightness(1.08); }
.link-btn.dim { opacity: .42; pointer-events: none; }

.land-footer { margin-top: 34px; font-size: 12px; color: var(--text3); }

/* ════ MENU ════ */
#menu { flex-direction: column; }

.menu-topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--card); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
  box-shadow: var(--shadow);
}
.back-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--p10); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--primary); font-size: 20px; font-weight: 700;
  flex-shrink: 0; transition: background .15s; font-family: var(--font);
}
.back-btn:hover { background: var(--p20); }
.topbar-title { font-size: 16px; font-weight: 800; color: var(--primary); flex: 1; text-align: center; }
.topbar-spacer { width: 36px; flex-shrink: 0; }

.menu-loading {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  color: var(--text3); font-size: 14px;
}
.spinner {
  width: 34px; height: 34px;
  border: 3px solid var(--p10); border-top-color: var(--primary);
  border-radius: 50%; animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.menu-content { flex: 1; padding-bottom: 60px; }

/* Category label */
.cat-label {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 16px 10px;
}
.cat-label-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.cat-label-name { font-size: 15px; font-weight: 900; color: var(--primary); white-space: nowrap; }
.cat-label-line { flex: 1; height: 1px; background: var(--border); }
.cat-label-count {
  font-size: 11px; font-weight: 700; color: #fff;
  background: var(--primary); padding: 1px 8px; border-radius: 20px; white-space: nowrap;
}

/* Item card — بطاقة كاملة العرض */
.item-card {
  background: var(--card);
  margin: 0 10px 14px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 3px 14px rgba(0,0,0,.08);
  cursor: pointer;
  /* scroll-reveal */
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .4s ease, transform .4s ease, box-shadow .2s;
}
.item-card:hover { box-shadow: var(--shadow-p); }
.item-card.visible { opacity: 1; transform: translateY(0); }

.item-img-wrap {
  width: 100%; aspect-ratio: 1/1;
  overflow: hidden; background: #ebebeb; position: relative;
}
/* fade-in عند تحميل الصورة */
.item-img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  opacity: 0; transition: opacity .35s ease, transform .35s;
}
.item-img.loaded { opacity: 1; }
.item-card:hover .item-img { transform: scale(1.04); }
.item-img-ph {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #ebebeb 0%, #d8d8d8 100%);
  animation: shimmer 1.4s infinite;
  background-size: 200% 100%;
}

.item-best-badge {
  position: absolute; top: 10px; right: 10px;
  font-size: 11px; font-weight: 800; color: #fff;
  background: var(--primary); padding: 3px 10px; border-radius: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

.item-info { padding: 14px 16px 18px; text-align: center; }
.item-name {
  font-size: 19px; font-weight: 900; color: var(--text);
  line-height: 1.35; margin-bottom: 6px;
}
.item-desc {
  font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 12px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item-footer { display: flex; align-items: center; justify-content: center; }
.item-price { font-size: 20px; font-weight: 900; color: var(--primary); }

/* ── Modal ── */
.modal-bd {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 100;
  backdrop-filter: blur(4px);
  align-items: flex-end; justify-content: center;
}
.modal-bd.open { display: flex; animation: fadein .2s; }
@keyframes fadein { from{opacity:0} to{opacity:1} }
.modal-sheet {
  width: 100%; max-width: 520px;
  background: var(--card); border-radius: 24px 24px 0 0;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 -6px 30px rgba(0,0,0,.2);
  animation: slideup .28s cubic-bezier(.4,0,.2,1);
}
@keyframes slideup { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-drag { width: 38px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
.modal-img-wrap { position: relative; }
.modal-img { width: 100%; height: 220px; object-fit: cover; }
.modal-img-ph { width: 100%; height: 160px; background: linear-gradient(135deg, var(--p10), var(--p20)); }
.modal-close {
  position: absolute; top: 12px; left: 12px;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--card); border: none; cursor: pointer;
  color: var(--text); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow); z-index: 2;
}
.modal-body { padding: 20px 20px 44px; }
.modal-name { font-size: 21px; font-weight: 900; color: var(--text); margin-bottom: 8px; line-height: 1.3; }
.modal-desc { font-size: 14px; color: var(--text2); line-height: 1.75; margin-bottom: 16px; }
.modal-price { display: inline-block; font-size: 17px; font-weight: 900; color: #fff; background: var(--primary); padding: 7px 20px; border-radius: 50px; box-shadow: var(--shadow-p); }
.modal-best { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--primary); border: 1.5px solid var(--border); background: var(--p10); padding: 5px 12px; border-radius: 50px; margin-right: 10px; }

.hidden { display: none !important; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- LANDING -->
<div class="view active" id="landing">
  <div class="landing-inner">
    <div class="logo-ring">
      <div class="logo-inner" id="logoInner"><div class="logo-ph"></div></div>
    </div>
    <div class="land-name" id="landName">ميلز</div>
    <div class="land-tagline" id="landTagline">وجبات التوفير</div>

    <a id="btnMaps" class="link-btn dim" href="#" target="_blank" rel="noopener">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <span class="btn-text">الموقع على جوجل ماب</span>
      <span class="btn-arrow">‹</span>
    </a>

    <button id="btnMenu" class="link-btn" onclick="showMenu()">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </div>
      <span class="btn-text">المنيو الإلكتروني</span>
      <span class="btn-arrow">‹</span>
    </button>

    <a id="btnReview" class="link-btn dim" href="#" target="_blank" rel="noopener">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <span class="btn-text">تقييمك يهمنا</span>
      <span class="btn-arrow">‹</span>
    </a>

    <div class="land-footer" id="landFooter">ميلز</div>
  </div>
</div>

<!-- MENU -->
<div class="view" id="menu">
  <div class="menu-topbar">
    <button class="back-btn" onclick="showLanding()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="topbar-title" id="menuTitle">المنيو</div>
    <div class="topbar-spacer"></div>
  </div>
  <div class="menu-loading" id="menuLoading">
    <div class="spinner"></div>
    جاري التحميل…
  </div>
  <div class="menu-content hidden" id="menuContent"></div>
</div>

<!-- MODAL -->
<div class="modal-bd" id="modalBd" onclick="closeMd(event)">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <div class="modal-img-wrap">
      <button class="modal-close" onclick="closeMdNow()">✕</button>
      <div id="mdImg"></div>
    </div>
    <div class="modal-body">
      <div class="modal-name" id="mdName"></div>
      <div class="modal-desc" id="mdDesc"></div>
      <span class="modal-best hidden" id="mdBest">⭐ الأكثر طلباً</span>
      <span class="modal-price" id="mdPrice"></span>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
