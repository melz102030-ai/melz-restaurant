name: E2E

# رحلة طلب كاملة في متصفح حقيقي على محاكي Firebase ونسخة محلية من خادم الطلبات.
# لا تستخدم أي سر، ولا تصل إلى قاعدة البيانات أو الموقع الحي.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "build/**"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  order-flow:
    name: رحلة الطلب
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_ERRORS: ${{ github.workspace }}/e2e-errors.txt
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build test app
        run: |
          flutter pub get
          flutter build web --release --dart-define=E2E=true --dart-define=WORKER_URL=http://127.0.0.1:8787
          rm -rf build/web/k
          mkdir -p build/web/k
          cp -r web_kitchen_lite/* build/web/k/

      - name: Install browser
        run: |
          npm install --prefix e2e --no-audit --no-fund
          npx --prefix e2e playwright install --with-deps chromium

      - name: Run order flow
        run: npx firebase-tools@latest emulators:exec --only firestore,auth --project demo-melz "bash e2e/run.sh"

      - name: Show failure reason
        if: failure()
        run: |
          [ -f "$E2E_ERRORS" ] || exit 0
          head -n 9 "$E2E_ERRORS" | sed 's/^/::error::/'
