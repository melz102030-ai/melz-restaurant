<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<base href="/m/">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ميلز</title>
<link rel="icon" href="/icons/Icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icons/Icon-192.png">
<meta name="theme-color" id="metaTheme" content="#6A0DAD">

<!-- الخط يُحقن ديناميكياً بعد قراءة الثيم من Firebase -->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── CSS Variables (defaults = ألوان التطبيق الافتراضية) ── */
:root {
  --primary:    #6A0DAD;
  --secondary:  #800040;
  --bg:         #F5EEDC;
  --card:       #FFFFFF;
  --text:       #1A0030;
  --text2:      rgba(26,0,48,.6);
  --text3:      rgba(26,0,48,.35);
  --p10:        rgba(106,13,173,.1);
  --p20:        rgba(106,13,173,.2);
  --border:     rgba(106,13,173,.15);
  --font:       'Cairo', sans-serif;
  --r:          16px;
  --shadow:     0 4px 20px rgba(0,0,0,.1);
  --shadow-p:   0 6px 24px rgba(106,13,173,.25);
}

html { height: 100%; }
body {
  min-height: 100%;
  background-color: var(--bg);
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  transition: background-color .3s;
}

/* ── Views ── */
.view { display: none; min-height: 100vh; }
.view.active { display: flex; flex-direction: column; }

/* ════════════ LANDING ════════════ */
#landing {
  align-items: center;
  justify-content: center;
  padding: 50px 20px 70px;
  text-align: center;
}
.landing-inner { width: 100%; max-width: 400px; }

/* Logo */
.logo-ring {
  width: 100px; height: 100px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  margin: 0 auto 20px;
  box-shadow: var(--shadow-p);
}
.logo-inner {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: var(--bg);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
}
.logo-inner img { width: 100%; height: 100%; object-fit: cover; }

.land-name {
  font-size: 28px;
  font-weight: 900;
  color: var(--primary);
  margin-bottom: 6px;
  letter-spacing: -.3px;
}
.land-tagline {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 44px;
}

/* Link buttons */
.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 20px;
  margin-bottom: 12px;
  border-radius: var(--r);
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  text-align: right;
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.link-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-p); border-color: var(--primary); }
.link-btn:active { transform: translateY(0); }

.btn-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: var(--p10);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  color: var(--primary);
}
.btn-text { flex: 1; }
.btn-arrow { color: var(--text3); font-size: 18px; flex-shrink: 0; font-weight: 400; }

/* Featured = المنيو */
.link-btn.featured {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: var(--shadow-p);
}
.link-btn.featured .btn-icon { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.25); color: #fff; }
.link-btn.featured .btn-arrow { color: rgba(255,255,255,.6); }
.link-btn.featured:hover { filter: brightness(1.08); }

.disabled-btn { opacity: .4; pointer-events: none; }

.land-footer { margin-top: 36px; font-size: 12px; color: var(--text3); }

/* ════════════ MENU VIEW ════════════ */
#menu { flex-direction: column; }

/* Top bar */
.menu-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
  box-shadow: var(--shadow);
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--p10);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
  font-size: 20px; font-weight: 700;
  flex-shrink: 0;
  transition: background .15s;
  font-family: var(--font);
}
.back-btn:hover { background: var(--p20); }
.topbar-title { font-size: 16px; font-weight: 800; color: var(--primary); flex: 1; text-align: center; }
.topbar-spacer { width: 36px; flex-shrink: 0; }

/* Search */
.search-wrap {
  padding: 10px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.search-box {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 50px; padding: 9px 14px;
  transition: border-color .15s;
}
.search-box:focus-within { border-color: var(--primary); }
.search-box input {
  flex: 1; background: none; border: none; outline: none;
  font-family: var(--font); font-size: 14px; color: var(--text); direction: rtl;
}
.search-box input::placeholder { color: var(--text3); }
.search-box svg { color: var(--text3); flex-shrink: 0; }
.search-clear { background:none; border:none; cursor:pointer; color:var(--text3); font-size:15px; padding:0; font-family:var(--font); }

/* Cat tabs */
.cat-tabs-wrap {
  overflow-x: auto; scrollbar-width: none; white-space: nowrap;
  padding: 10px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.cat-tabs-wrap::-webkit-scrollbar { display: none; }
.cat-tabs { display: inline-flex; gap: 8px; }
.cat-tab {
  padding: 6px 16px; border-radius: 50px;
  font-size: 13px; font-weight: 600; font-family: var(--font);
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: transparent; color: var(--text2);
  transition: all .18s; white-space: nowrap;
}
.cat-tab.active {
  background: var(--primary); color: #fff;
  border-color: var(--primary);
  box-shadow: var(--shadow-p);
  font-weight: 700;
}

/* Menu body */
.menu-body { flex: 1; padding: 10px 12px 40px; }

/* Category section */
.cat-section { margin-bottom: 10px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); background: var(--card); }
.cat-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer; user-select: none;
  transition: background .15s;
}
.cat-head:hover { background: var(--p10); }
.cat-head.open { border-bottom: 1px solid var(--border); background: var(--p10); }
.cat-head-left { display: flex; align-items: center; gap: 10px; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 6px var(--p20); flex-shrink: 0; }
.cat-title { font-size: 15px; font-weight: 800; color: var(--text); }
.cat-count { font-size: 11px; font-weight: 700; background: var(--primary); color: #fff; padding: 1px 7px; border-radius: 20px; }
.cat-arrow { color: var(--primary); transition: transform .25s; }
.cat-head.open .cat-arrow { transform: rotate(180deg); }

/* Items grid */
.items-panel { display: none; }
.items-panel.open { display: block; }
.items-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
}
@media (min-width: 480px) { .items-grid { grid-template-columns: repeat(3,1fr); } }
@media (min-width: 720px) { .items-grid { grid-template-columns: repeat(4,1fr); } }

.item-card { background: var(--card); cursor: pointer; transition: background .12s; }
.item-card:hover { background: var(--bg); }
.item-img-wrap { aspect-ratio: 1/1; overflow: hidden; background: var(--bg); position: relative; }
.item-img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
.item-card:hover .item-img { transform: scale(1.05); }
.item-img-ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:32px; background: var(--bg); }
.item-best { position:absolute; top:6px; right:6px; background:var(--primary); color:#fff; font-size:9px; font-weight:800; padding:2px 6px; border-radius:20px; }
.item-info { padding: 9px 10px 12px; }
.item-name { font-size:13px; font-weight:700; color:var(--text); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.item-price { font-size:13px; font-weight:800; color:var(--primary); margin-top:4px; }

/* Search results wrapper */
.search-cat-wrap { border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); background: var(--card); }

/* ── Modal ── */
.modal-bd {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.6); z-index:100;
  backdrop-filter: blur(4px);
  align-items:flex-end; justify-content:center;
}
.modal-bd.open { display:flex; animation:fadein .2s; }
@keyframes fadein { from{opacity:0} to{opacity:1} }
.modal-sheet {
  width:100%; max-width:520px;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 -6px 30px rgba(0,0,0,.2);
  animation: slideup .28s cubic-bezier(.4,0,.2,1);
}
@keyframes slideup { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-drag { width:38px; height:4px; background:var(--border); border-radius:2px; margin:12px auto 0; }
.modal-img-wrap { position:relative; }
.modal-img { width:100%; height:220px; object-fit:cover; }
.modal-img-ph { width:100%; height:160px; display:flex; align-items:center; justify-content:center; font-size:64px; background:var(--bg); }
.modal-close {
  position:absolute; top:12px; left:12px; width:34px; height:34px;
  border-radius:50%; background:var(--card); border:none; cursor:pointer;
  color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow); z-index:2;
}
.modal-body { padding:20px 20px 44px; }
.modal-name { font-size:21px; font-weight:900; color:var(--text); margin-bottom:8px; line-height:1.3; }
.modal-desc { font-size:14px; color:var(--text2); line-height:1.75; margin-bottom:16px; }
.modal-price { display:inline-block; font-size:17px; font-weight:900; color:#fff; background:var(--primary); padding:7px 20px; border-radius:50px; box-shadow:var(--shadow-p); }
.modal-best-badge { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--primary); border:1.5px solid var(--border); background:var(--p10); padding:5px 12px; border-radius:50px; margin-right:10px; }

/* ── States ── */
.state-msg { text-align:center; padding:60px 20px; color:var(--text3); font-size:14px; }
.spinner { width:34px; height:34px; border:3px solid var(--p10); border-top-color:var(--primary); border-radius:50%; animation:spin .75s linear infinite; margin:0 auto 14px; }
@keyframes spin { to{transform:rotate(360deg)} }
.no-results { text-align:center; padding:50px 20px; color:var(--text3); }
.hidden { display:none !important; }
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<!-- LANDING -->
<div class="view active" id="landing">
  <div class="landing-inner">
    <div class="logo-ring">
      <div class="logo-inner" id="logoInner">🍽️</div>
    </div>
    <div class="land-name" id="landName">ميلز</div>
    <div class="land-tagline" id="landTagline">وجبات التوفير</div>

    <a id="btnMaps" class="link-btn disabled-btn" href="#" target="_blank" rel="noopener">
      <div class="btn-icon">📍</div>
      <span class="btn-text">الموقع على جوجل ماب</span>
      <span class="btn-arrow">›</span>
    </a>

    <button id="btnMenu" class="link-btn featured" onclick="showMenu()">
      <div class="btn-icon">☰</div>
      <span class="btn-text">المنيو الإلكتروني</span>
      <span class="btn-arrow">›</span>
    </button>

    <a id="btnReview" class="link-btn disabled-btn" href="#" target="_blank" rel="noopener">
      <div class="btn-icon">⭐</div>
      <span class="btn-text">تقييمك يهمنا</span>
      <span class="btn-arrow">›</span>
    </a>

    <div class="land-footer" id="landFooter">ميلز · وجبات التوفير</div>
  </div>
</div>

<!-- MENU -->
<div class="view" id="menu">
  <div class="menu-topbar">
    <button class="back-btn" onclick="showLanding()">‹</button>
    <div class="topbar-title" id="menuTitle">المنيو</div>
    <div class="topbar-spacer"></div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="search" placeholder="ابحث عن صنف..." autocomplete="off">
      <button class="search-clear hidden" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>
  <div class="cat-tabs-wrap hidden" id="catTabsWrap">
    <div class="cat-tabs" id="catTabs"></div>
  </div>
  <div class="state-msg" id="menuLoading"><div class="spinner"></div>جاري التحميل...</div>
  <div class="menu-body hidden" id="menuBody"></div>
  <div class="menu-body hidden" id="searchResults"></div>
  <div class="no-results hidden" id="noResults">
    <div style="font-size:38px;margin-bottom:10px">🔍</div>
    لا توجد نتائج لـ «<span id="noQ"></span>»
  </div>
</div>

<!-- MODAL -->
<div class="modal-bd" id="modalBd" onclick="closeMd(event)">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <div class="modal-img-wrap">
      <button class="modal-close" onclick="closeMdNow()">✕</button>
      <div id="mdImg"></div>
    </div>
    <div class="modal-body">
      <div class="modal-name" id="mdName"></div>
      <div class="modal-desc" id="mdDesc"></div>
      <span class="modal-price" id="mdPrice"></span>
      <span class="modal-best-badge hidden" id="mdBest">⭐ الأكثر طلباً</span>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
