name: Tests

# تعمل مع كل تعديل، وسبب الفشل يظهر كتنبيه على التشغيل
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "build/**"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: تسعير الخادم
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if ! node --test cloudflare/lean-payments/pricing.test.mjs > "$RUNNER_TEMP/out.log" 2>&1; then
            grep -E "✖|AssertionError|Error:" "$RUNNER_TEMP/out.log" | head -n 10 | sed 's/^/::error::/'
            exit 1
          fi

  rules:
    name: قواعد الأمان
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm install --prefix firestore_tests --no-audit --no-fund
      - run: |
          if ! npx firebase-tools@latest emulators:exec --only firestore --project demo-melz "npm --prefix firestore_tests test" > "$RUNNER_TEMP/out.log" 2>&1; then
            grep -E "✖" "$RUNNER_TEMP/out.log" | sort -u | head -n 12 | sed 's/^/::error::/'
            exit 1
          fi

  app:
    name: التطبيق
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: |
          if ! flutter test > "$RUNNER_TEMP/out.log" 2>&1; then
            grep -E "\[E\]|Expected:|Actual:|Error:|error:" "$RUNNER_TEMP/out.log" | head -n 12 | sed 's/^/::error::/'
            exit 1
          fi
