<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meals</title>
<link rel="icon" href="icons/Icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/Icon-192.png">
<meta name="theme-color" content="#6A0DAD">
<style>
  :root {
    --purple: #6A0DAD;
    --purple-light: #9C4DCA;
    --purple-soft: rgba(106,13,173,.1);
    --manjawi: #800040;
    --bg: #F5EEDC;
    --surface: #FFFFFF;
    --surface-light: #EADFC8;
    --text-primary: #1A0030;
    --text-secondary: #5B4A75;
    --text-hint: #9B8BAD;
    --success: #4CAF50;
    --warning: #FF9800;
    --error: #F44336;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif; overscroll-behavior-y: none; }
  button { font-family: inherit; }
  img { -webkit-user-drag: none; }
  .hidden { display: none !important; }
  .view { min-height: 100vh; padding-bottom: 30px; }

  /* ── Top bar ─────────────────────────────────────────────── */
  header.topbar {
    position: sticky; top: 0; z-index: 30; background: var(--surface);
    box-shadow: 0 2px 10px rgba(0,0,0,.05); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand-logo {
    width: 38px; height: 38px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
  }
  .brand-name { font-weight: bold; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand-status { font-size: 10.5px; color: var(--text-hint); }
  .brand-status.open { color: var(--success); }
  .brand-status.closed { color: var(--error); }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none; background: var(--surface-light);
    color: var(--purple); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; flex-shrink: 0;
  }
  .icon-btn svg { width: 19px; height: 19px; }
  .cart-badge {
    position: absolute; top: -4px; left: -4px; background: var(--error); color: #fff; font-size: 10px; font-weight: bold;
    min-width: 17px; height: 17px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }
  .search-bar { padding: 0 14px 10px; background: var(--surface); }
  .search-bar input {
    width: 100%; padding: 10px 14px; border-radius: 12px; border: none; background: var(--surface-light);
    font-size: 14px; color: var(--text-primary);
  }

  /* ── Category chips ──────────────────────────────────────── */
  .cat-bar {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; background: var(--surface);
    scrollbar-width: none; position: sticky; top: 61px; z-index: 29; box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1.5px solid var(--surface-light);
    background: var(--surface); color: var(--text-secondary); font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .cat-chip.active { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* ── Item grid ───────────────────────────────────────────── */
  .section-title { padding: 16px 14px 8px; font-size: 15px; font-weight: bold; }
  .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 14px 14px; }
  .item-card {
    background: var(--surface); border-radius: 16px; overflow: hidden; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); display: flex; flex-direction: column;
  }
  .item-img-wrap { position: relative; width: 100%; aspect-ratio: 1.3; background: var(--surface-light); }
  .item-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item-badges { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 3px; }
  .item-badge { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 6px; color: #fff; }
  .item-badge.best { background: var(--warning); }
  .item-badge.new { background: var(--success); }
  .item-badge.off { background: var(--error); }
  .item-unavailable-overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; color: var(--text-hint);
  }
  .item-info { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .item-name { font-size: 13px; font-weight: bold; line-height: 1.3; }
  .item-desc { font-size: 10.5px; color: var(--text-hint); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item-price-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
  .item-price { font-size: 13.5px; font-weight: bold; color: var(--purple); }
  .item-price-old { font-size: 10.5px; color: var(--text-hint); text-decoration: line-through; margin-right: 4px; }
  .item-add-btn {
    width: 26px; height: 26px; border-radius: 8px; border: none; background: var(--purple); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .item-add-btn svg { width: 14px; height: 14px; }

  /* ── Bottom sheet (item detail / cart extras) ───────────────────────── */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet-card {
    background: var(--surface); border-radius: 22px 22px 0 0; width: 100%; max-width: 520px; max-height: 92vh;
    display: flex; flex-direction: column; overflow: hidden; animation: sheetUp .25s ease both;
  }
  @keyframes sheetUp { from { transform: translateY(30px); opacity:.6; } to { transform: none; opacity:1; } }
  .sheet-handle { width: 36px; height: 4px; background: var(--surface-light); border-radius: 2px; margin: 10px auto 0; }
  .sheet-scroll { overflow-y: auto; flex: 1; }
  .sheet-img { width: 100%; aspect-ratio: 1.6; object-fit: cover; background: var(--surface-light); }
  .sheet-body { padding: 16px 18px 10px; }
  .sheet-title { font-size: 19px; font-weight: bold; }
  .sheet-price { font-size: 16px; font-weight: bold; color: var(--purple); margin-top: 4px; }
  .sheet-desc { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.6; }

  .opt-group { margin-top: 18px; }
  .opt-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .opt-group-title { font-size: 14px; font-weight: bold; }
  .opt-group-req { font-size: 10px; color: var(--error); background: rgba(244,67,54,.1); padding: 2px 7px; border-radius: 6px; font-weight: bold; }
  .opt-group-hint { font-size: 10.5px; color: var(--text-hint); }
  .opt-row {
    display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px;
    background: var(--bg); margin-bottom: 7px; cursor: pointer;
  }
  .opt-row.selected { background: var(--purple-soft); outline: 1.5px solid var(--purple); }
  .opt-row-label { font-size: 13px; color: var(--text-primary); display: flex; align-items: center; gap: 9px; }
  .opt-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--text-hint); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .opt-row.selected .opt-check { background: var(--purple); border-color: var(--purple); }
  .opt-check.round { border-radius: 50%; }
  .opt-check svg { width: 12px; height: 12px; color: #fff; }
  .opt-row-price { font-size: 12px; color: var(--text-hint); font-weight: 600; }

  .qty-stepper { display: flex; align-items: center; gap: 14px; }
  .qty-btn {
    width: 34px; height: 34px; border-radius: 10px; border: none; background: var(--surface-light); color: var(--purple);
    font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .qty-val { font-size: 16px; font-weight: bold; min-width: 22px; text-align: center; }

  .sheet-footer { padding: 12px 18px; border-top: 1px solid var(--bg); display: flex; align-items: center; gap: 12px; }
  .btn-primary {
    flex: 1; padding: 14px; border: none; border-radius: 14px; cursor: pointer; font-weight: bold; font-size: 14.5px;
    background: linear-gradient(135deg, var(--purple), var(--purple-light)); color: #fff;
    box-shadow: 0 6px 16px rgba(106,13,173,.3); display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:disabled { opacity: .5; pointer-events: none; }
  .btn-ghost {
    padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--surface-light); background: transparent;
    color: var(--text-secondary); font-weight: bold; font-size: 13.5px; cursor: pointer;
  }

  /* ── Cart view ───────────────────────────────────────────── */
  .cart-item-row { display: flex; gap: 10px; padding: 12px 14px; background: var(--surface); margin: 0 14px 10px; border-radius: 14px; align-items: center; }
  .cart-item-img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--surface-light); flex-shrink: 0; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 13px; font-weight: bold; }
  .cart-item-opts { font-size: 10.5px; color: var(--text-hint); margin-top: 2px; }
  .cart-item-price { font-size: 12.5px; color: var(--purple); font-weight: bold; margin-top: 4px; }
  .cart-stepper { display: flex; align-items: center; gap: 8px; }
  .cart-qty-btn { width: 26px; height: 26px; border-radius: 8px; border: none; background: var(--surface-light); color: var(--purple); font-weight: bold; cursor: pointer; }

  .section-card { background: var(--surface); margin: 0 14px 14px; border-radius: 16px; padding: 14px; }
  .section-card-title { font-size: 13.5px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-pill {
    flex: 1; padding: 11px; border-radius: 12px; border: 1.5px solid var(--surface-light); background: var(--bg);
    color: var(--text-secondary); font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .toggle-pill.active { background: var(--purple); border-color: var(--purple); color: #fff; }
  .field-input {
    width: 100%; padding: 11px 13px; border-radius: 11px; border: 1.5px solid var(--surface-light); background: var(--bg);
    color: var(--text-primary); font-size: 13.5px; font-family: inherit; margin-top: 8px;
  }
  textarea.field-input { resize: vertical; min-height: 54px; }
  .locate-btn {
    margin-top: 8px; width: 100%; padding: 11px; border-radius: 11px; border: 1.5px dashed var(--purple); background: var(--purple-soft);
    color: var(--purple); font-weight: bold; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .location-ok { margin-top: 8px; padding: 10px; border-radius: 10px; background: rgba(76,175,80,.1); color: var(--success); font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; }

  .pay-option { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--surface-light); margin-bottom: 8px; cursor: pointer; }
  .pay-option.selected { border-color: var(--purple); background: var(--purple-soft); }
  .pay-radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--text-hint); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .pay-option.selected .pay-radio { border-color: var(--purple); }
  .pay-radio-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--purple); display: none; }
  .pay-option.selected .pay-radio-dot { display: block; }
  .pay-label { font-size: 13px; font-weight: 600; }

  .bank-card { margin-top: 10px; padding: 14px; border-radius: 14px; background: linear-gradient(135deg, var(--purple), var(--purple-light)); color: #fff; }
  .bank-card-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .bank-iban { font-size: 16px; font-weight: bold; letter-spacing: 1px; direction: ltr; text-align: center; margin: 8px 0; }
  .bank-copy-btn { background: rgba(255,255,255,.2); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }

  .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); padding: 4px 0; }
  .summary-row.total { font-size: 15px; font-weight: bold; color: var(--text-primary); padding-top: 8px; border-top: 1px dashed var(--surface-light); margin-top: 6px; }

  .cart-footer {
    position: sticky; bottom: 0; background: var(--surface); padding: 12px 14px; box-shadow: 0 -2px 10px rgba(0,0,0,.06);
  }

  /* ── Tracking view ───────────────────────────────────────── */
  .track-step { display: flex; gap: 12px; padding: 10px 0; }
  .track-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface-light); color: var(--text-hint); }
  .track-dot.done { background: var(--success); color: #fff; }
  .track-dot.current { background: var(--purple); color: #fff; }
  .track-line { width: 2px; flex: 1; background: var(--surface-light); margin: 0 13px; }
  .track-label { font-size: 13.5px; font-weight: 600; color: var(--text-hint); }
  .track-label.active { color: var(--text-primary); font-weight: bold; }

  /* ── Generic ─────────────────────────────────────────────── */
  .empty-msg { text-align: center; color: var(--text-hint); font-size: 13px; padding: 40px 20px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200;
    background: var(--text-primary); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 6px 16px rgba(0,0,0,.25); max-width: 90vw; text-align: center;
  }
  .confirm-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 150; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .confirm-card { background: var(--surface); border-radius: 20px; width: 100%; max-width: 380px; padding: 22px; text-align: center; }
  .confirm-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--purple-soft); color: var(--purple); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .confirm-icon svg { width: 26px; height: 26px; }
  .confirm-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .confirm-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .confirm-phone { margin-top: 14px; padding: 10px; border-radius: 12px; background: var(--purple-soft); color: var(--purple); font-weight: bold; font-size: 17px; direction: ltr; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  .loading-logo { width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, var(--purple), var(--purple-light)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 30px; }
</style>
</head>
<body>

  <div id="loadingScreen" class="loading-screen">
    <div class="loading-logo">M</div>
    <div class="spinner" style="border-top-color:var(--purple);border-color:rgba(106,13,173,.25)"></div>
  </div>

  <!-- ───────── Menu ───────── -->
  <div id="menuView" class="view hidden">
    <header class="topbar">
      <div class="brand">
        <img id="brandLogo" class="brand-logo" src="" alt="">
        <div style="min-width:0">
          <div id="brandName" class="brand-name">Meals</div>
          <div id="brandStatus" class="brand-status"></div>
        </div>
      </div>
      <button class="icon-btn" id="searchToggleBtn" title="بحث"></button>
      <button class="icon-btn" id="cartBtn" title="السلة">
        <span id="cartBadge" class="cart-badge hidden">0</span>
      </button>
    </header>
    <div class="search-bar hidden" id="searchBar">
      <input id="searchInput" placeholder="ابحث عن صنف...">
    </div>
    <div class="cat-bar" id="catBar"></div>
    <div id="menuRoot"></div>
  </div>

  <!-- ───────── Cart ───────── -->
  <div id="cartView" class="view hidden">
    <header class="topbar">
      <button class="icon-btn" id="cartBackBtn"></button>
      <div class="brand-name" style="flex:1">سلتي</div>
    </header>
    <div id="cartRoot"></div>
  </div>

  <!-- ───────── Tracking ───────── -->
  <div id="trackView" class="view hidden">
    <header class="topbar">
      <button class="icon-btn" id="trackBackBtn"></button>
      <div class="brand-name" style="flex:1">تتبع الطلب</div>
    </header>
    <div id="trackRoot"></div>
  </div>

  <div id="sheetRoot"></div>
  <div id="confirmRoot"></div>
  <div id="toastRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
